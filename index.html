<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>学習セッション</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="app">
      <section id="setup-panel" class="panel">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Learning Session</p>
            <h1>学習セッション</h1>
            <p class="lead">担当者から案内された項目を選び、表示された意味と英単語の対応を覚えてください。</p>
          </div>
          <div class="session-badge">準備前</div>
        </div>

        <section class="setup-section">
          <h2>参加情報</h2>
          <div class="grid primary-grid">
            <label>
              参加者ID
              <input id="participant-id" type="text" autocomplete="off" placeholder="例: 001" />
            </label>
            <label>
              案内番号
              <select id="accent-condition">
                <option value="">選択してください</option>
                <option value="E">E</option>
                <option value="J">J</option>
                <option value="C">C</option>
              </select>
            </label>
          </div>
        </section>

        <input id="phase-mode" type="hidden" value="learning" />
        <div class="save-option">
          <label class="checkbox-row">
            <input id="auto-download" type="checkbox" checked />
            <span>終了時にファイルを保存する</span>
          </label>
        </div>

        <div class="summary">
          <p>このページでは学習セッションのみを行います。</p>
          <p>開始後は、表示された意味を見ながら英単語の音声を聞いて覚えます。</p>
          <p>途中でブラウザを閉じず、担当者の指示があるまで同じ画面で続けてください。</p>
        </div>
        <div id="recovery-card" class="recovery-card hidden">
          <div>
            <strong>保存途中の記録があります</strong>
            <span id="recovery-summary"></span>
          </div>
          <div class="recovery-actions">
            <button id="recovery-download-btn" type="button" class="secondary">途中の記録を保存</button>
            <button id="recovery-clear-btn" type="button" class="secondary">消去</button>
          </div>
        </div>
        <div class="actions">
          <button id="prepare-btn">準備する</button>
          <button id="start-btn" disabled>開始する</button>
          <button id="download-btn" class="success" disabled>ファイルを保存</button>
        </div>
      </section>

      <section id="task-panel" class="task-panel" aria-live="polite">
        <div id="progress">
          <div class="progress-top">
            <div id="progress-label"></div>
            <button id="interrupt-btn" type="button" class="secondary interrupt-btn" disabled>中断して保存</button>
          </div>
          <div id="progress-track"><div id="progress-fill"></div></div>
        </div>
        <div id="stimulus-stage">
          <div id="fixation">+</div>
          <img id="stimulus-img" alt="" />
          <div id="visual-card">
            <div id="visual-label"></div>
            <div id="visual-note"></div>
          </div>
          <div id="sound-cue">音声</div>
          <div id="message"></div>
          <input id="text-response" type="text" autocomplete="off" class="hidden" />
        </div>
        <div id="response-hint"></div>
      </section>

      <div id="status"></div>
      <pre id="log"></pre>
    </main>

    <script src="vendor/jszip.min.js"></script>
    <script src="stimuli.js"></script>
    <script src="app.js"></script>
  </body>
</html>
